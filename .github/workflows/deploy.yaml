name: Check and deploy Kazan

on:
  push:
    branches: [feat/kazan-tatarstan]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kazan-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out city
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Aube and Node.js
        uses: jdx/aube-action@0fd8685e54606c8893cc05119759aa3bc925e30b # v1.1.0
        with:
          version: 2.5.1
          node-version: 24

      - name: Install dependencies
        run: aube install --frozen-lockfile

      - name: Test
        run: aube run test

      - name: Build
        run: aube run build

      - name: Deploy production
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/feat/kazan-tatarstan'
        run: aube exec wrangler pages deploy --project-name slop-kazan --branch feat/kazan-tatarstan
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify production responds
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/feat/kazan-tatarstan'
        run: curl --fail --silent --show-error --retry 3 https://kazan.adelnz.com/ > /dev/null
