name: Build and deploy Kazan

on:
  push:
    branches: [feat/kazan-tatarstan, experiment/kazan-upstream-engine]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kazan-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out city
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Aube and Node.js
        uses: jdx/aube-action@0fd8685e54606c8893cc05119759aa3bc925e30b # v1.1.0
        with:
          version: 2.5.1
          node-version: 24

      - name: Install dependencies
        run: aube install --frozen-lockfile

      - name: Build
        run: aube run build

      - name: Deploy Pages production or engine preview
        id: pages
        shell: bash
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/feat/kazan-tatarstan' || github.ref == 'refs/heads/experiment/kazan-upstream-engine')
        run: |
          aube exec wrangler pages deploy --project-name slop-kazan --branch "$PAGES_BRANCH" --commit-hash "$GITHUB_SHA" | tee "$RUNNER_TEMP/kazan-pages-deploy.log"
          node --input-type=module <<'JS'
          import { readFileSync, appendFileSync } from 'node:fs';
          const log = readFileSync(`${process.env.RUNNER_TEMP}/kazan-pages-deploy.log`, 'utf8');
          const url = log.match(/Deployment alias URL:\s+(https:\/\/[^\s]+\.pages\.dev)/)?.[1]
            || log.match(/Take a peek over at (https:\/\/[^\s]+\.pages\.dev)/)?.[1];
          if (!url) throw new Error('Wrangler did not report a Pages deployment URL');
          appendFileSync(process.env.GITHUB_OUTPUT, `url=${url}\n`);
          JS
        env:
          PAGES_BRANCH: ${{ github.ref_name }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify production responds
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/feat/kazan-tatarstan'
        run: curl --fail --silent --show-error --retry 3 https://kazan.adelnz.com/ > /dev/null

      - name: Verify engine Pages preview responds
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/experiment/kazan-upstream-engine'
        run: curl --fail --silent --show-error --retry 3 "$DEPLOYMENT_URL/" > /dev/null
        env:
          DEPLOYMENT_URL: ${{ steps.pages.outputs.url }}
